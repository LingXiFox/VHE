[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vhe-research"
version = "0.0.1"
description = "VHE: Speaker-Independent Neural Acoustic Refinement for Voice Humanization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]
train = ["torch>=2.3", "soundfile>=0.12", "scipy>=1.12", "tensorboard>=2.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[project.scripts]
vhe = "vhe.cli:main"
